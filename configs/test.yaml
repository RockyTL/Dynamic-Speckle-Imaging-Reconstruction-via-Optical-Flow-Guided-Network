# Testing configuration for Dynamic Speckle Imaging Reconstruction

# ---- Data ----
data:
  base_path: "data/datasets"
  pos: "obj_128_bg_256_move_16"
  num_frames: 5
  num_workers: 12

# ---- Checkpoint ----
checkpoint:
  path: "data/results/checkpoints/checkpoint_epoch_20.pth"

# ---- Output ----
output:
  save_dir: "data/results"

# ---- Experimental data paths ----
experiment:
  speckle_data_dir: "data/datasets/LCDSpeckle_0630"
  object_data_dir: "data/datasets/LCDobj_128_movetimes4_LeftUp10"
  flow_data_dir: "data/datasets/flow_times4_0630"

# ---- Batch checkpoint evaluation ----
batch_eval:
  checkpoint_dir: "data/lunwen_exp_checkpoints/checkpoints"
  save_root: "data/results_all_models"
  start_epoch: 20
  end_epoch: 50
  experiment_save_root: "data/experiment_results_withobjandflow_all"
